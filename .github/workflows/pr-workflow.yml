name: PR Build

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'

      - name: Build with JDK 17
        run: mvn -B install --no-transfer-progress -DskipTests

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Test with JDK 17
        run: mvn -v && mvn -B test

      - name: Check code formatting
        run: mvn -B --no-transfer-progress -pl main formatter:validate

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Test with JDK 21
        run: mvn -v && mvn -B test    

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Test with JDK 25
        run: mvn -v && mvn -B test   

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 27
      - name: Test with JDK 27
        run: mvn -v && mvn -B test   

  native-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Kryo
        run: mvn -B --no-transfer-progress -pl main package -DskipTests

      - name: Build and run the native image test
        run: native-image/build.sh
