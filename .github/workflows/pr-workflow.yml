name: PR Build

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # The build needs JDK 25, the tests run on each supported JDK with the classes built by JDK 25.
      - uses: actions/setup-java@v5
        id: jdk17
        with:
          distribution: 'temurin'
          java-version: 17
      - uses: actions/setup-java@v5
        id: jdk21
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: actions/setup-java@v5
        id: jdk27
        with:
          distribution: 'temurin'
          java-version: 27
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'

      - name: Build with JDK 25
        run: mvn -v && mvn -B install --no-transfer-progress -DskipTests

      - name: Test with JDK 17
        run: mvn -B test -Djvm=${{ steps.jdk17.outputs.path }}/bin/java
      - name: Test with JDK 17 and code generation with ASM
        run: mvn -B test -pl main -Djvm=${{ steps.jdk17.outputs.path }}/bin/java
        env:
          JAVA_TOOL_OPTIONS: -Dkryo.codeGeneration=true

      - name: Check code formatting
        run: mvn -B --no-transfer-progress -pl main formatter:validate

      - name: Test with JDK 21
        run: mvn -B test -Djvm=${{ steps.jdk21.outputs.path }}/bin/java
      - name: Test with JDK 21 and code generation with ASM
        run: mvn -B test -pl main -Djvm=${{ steps.jdk21.outputs.path }}/bin/java
        env:
          JAVA_TOOL_OPTIONS: -Dkryo.codeGeneration=true

      - name: Test with JDK 25
        run: mvn -B test
      - name: Test with JDK 25 and reflection field access
        run: mvn -B test -pl main
        env:
          JAVA_TOOL_OPTIONS: -Dkryo.fieldAccess=REFLECTION
      - name: Test with JDK 25 and Unsafe field access
        run: mvn -B test -pl main
        env:
          JAVA_TOOL_OPTIONS: -Dkryo.fieldAccess=UNSAFE --sun-misc-unsafe-memory-access=allow
      - name: Test with JDK 25 and code generation
        run: mvn -B test -pl main
        env:
          JAVA_TOOL_OPTIONS: -Dkryo.codeGeneration=true
      - name: Test with JDK 25 and code generation with ASM
        run: mvn -B test -pl main
        env:
          JAVA_TOOL_OPTIONS: -Dkryo.codeGeneration=true -Dkryo.codeGeneration.backend=asm

      - name: Test with JDK 27
        run: mvn -B test -Djvm=${{ steps.jdk27.outputs.path }}/bin/java
      - name: Test with JDK 27 and code generation
        run: mvn -B test -pl main -Djvm=${{ steps.jdk27.outputs.path }}/bin/java
        env:
          JAVA_TOOL_OPTIONS: -Dkryo.codeGeneration=true

  native-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Kryo
        run: mvn -B --no-transfer-progress -pl main package -DskipTests

      - name: Build and run the native image test
        run: native-image/build.sh

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum API level, and the last one without Set12 and Stream#toList.
        api-level: [26, 33]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The build checks the Android API with Animal Sniffer. The runner has the Android SDK in ANDROID_HOME.
      - name: Build Kryo
        run: mvn -B --no-transfer-progress -pl main package -DskipTests

      - name: Convert to dex with D8 and test on Android API level ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: android/test.sh
