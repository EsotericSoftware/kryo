name: CI

on:
  push:
    branches:
      - master
      - kryo-6

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PUBLISH_ARTIFACTS: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/kryo-6' }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'

      - name: Build with JDK 17
        run: mvn -B install --no-transfer-progress -DskipTests

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Test with JDK 17         
        run: mvn -v && mvn -B test
        
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Test with JDK 21
        run: mvn -v && mvn -B test
        
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Test with JDK 25
        run: mvn -v && mvn -B test

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 27
      - name: Test with JDK 27
        run: mvn -v && mvn -B test
      
      - name: Set up settings.xml for Sonatype
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Publish SNAPSHOT version to Sonatype (we can skip tests, since we only deploy, if the build workflow succeeded)
        run: mvn -v && mvn -B -P requireSnapshot --no-transfer-progress -DskipTests deploy --settings build/settings-sonatype.xml
        if: env.PUBLISH_ARTIFACTS == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

  native-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Kryo
        run: mvn -B --no-transfer-progress -pl main package -DskipTests

      - name: Build and run the native image test
        run: native-image/build.sh
